[package]
name = "generate-sysregs"
version = "0.1.0"
authors = ["Andrew Walbran <qwandor@google.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A tool to generate a crate of accessors for Arm system registers based on the JSON description file."
repository = "https://git.trustedfirmware.org/arm-firmware-crates/arm-sysregs.git"
keywords = ["arm", "aarch64", "sysregs", "system", "registers"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
arm-sysregs-json = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
eyre = "0.6.14"
log = { workspace = true }
pretty_env_logger = "0.5.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
